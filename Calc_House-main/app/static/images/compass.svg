<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Верхние ручки циркуля -->
  <rect x="35" y="5" width="30" height="10" rx="3" ry="3" fill="#888" stroke="#555" stroke-width="1"/>
  
  <!-- Левая ножка циркуля -->
  <polygon points="38,15 42,15 50,85 46,85" fill="#ddd" stroke="#555" stroke-width="1"/>
  
  <!-- Правая ножка циркуля -->
  <polygon points="58,15 62,15 54,85 50,85" fill="#ddd" stroke="#555" stroke-width="1"/>
  
  <!-- Соединение ножек -->
  <circle cx="50" cy="15" r="3" fill="#888" stroke="#555" stroke-width="1"/>
  
  <!-- Игла на левой ножке -->
  <polygon points="46,85 50,85 48,95" fill="#333" stroke="#222" stroke-width="0.5"/>
  
  <!-- Карандаш на правой ножке -->
  <rect x="51" y="85" width="3" height="10" fill="#F4D03F" stroke="#555" stroke-width="0.5"/>
  <polygon points="51,95 54,95 52.5,98" fill="#333"/>
</svg> 